<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Votre Panier — IKODY SHOP</title>
<link rel="icon" href="/images/logo.png">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div id="siteHeader"></div>

<div class="page-head">
  <div class="wrap">
    <div class="breadcrumb"><a href="/index.html">Accueil</a> / Panier</div>
    <h1>Votre Panier</h1>
  </div>
</div>

<div class="section">
  <div class="wrap">
    <div id="cartContent"></div>
  </div>
</div>

<div id="siteFooter"></div>

<script src="/js/icons.js"></script>
<script src="/js/api.js"></script>
<script src="/js/cart.js"></script>
<script src="/js/layout.js"></script>
<script>
initLayout('cart');

function render() {
  const items = Cart.read();
  const el = document.getElementById('cartContent');

  if (items.length === 0) {
    el.innerHTML = `
      <div class="empty-state">
        <div class="glyph">${ICONS.basket}</div>
        <p>Votre panier est vide.</p>
        <a href="/shop.html" class="btn btn-primary" style="margin-top:16px;">Parcourir les maillots</a>
      </div>`;
    return;
  }

  el.innerHTML = `
    <div class="cart-layout">
      <div>
        ${items.map(i => `
          <div class="cart-line">
            <div class="thumb">${i.image_url ? `<img src="${escapeHtml(i.image_url)}" alt="">` : `<span class="placeholder">${ICONS.shirt}</span>`}</div>
            <div class="meta">
              <div class="team">${escapeHtml(i.team)}</div>
              <h4>${escapeHtml(i.name)}</h4>
              <span class="size-badge">Taille ${escapeHtml(i.size)}</span>
            </div>
            <div class="right">
              <span class="price">${fmtMoney(i.price * i.qty)}</span>
              <div class="qty-stepper">
                <button type="button" onclick="changeQty(${i.product_id}, '${i.size}', ${i.qty - 1})">−</button>
                <span>${i.qty}</span>
                <button type="button" onclick="changeQty(${i.product_id}, '${i.size}', ${i.qty + 1})">+</button>
              </div>
              <a href="#" class="remove-link" onclick="event.preventDefault(); Cart.remove(${i.product_id}, '${i.size}'); render();">Retirer</a>
            </div>
          </div>
        `).join('')}
        <a href="/shop.html" style="display:inline-block; margin-top:20px; font-weight:700; font-size:14px;">← Continuer mes achats</a>
      </div>

      <div class="summary-box">
        <h3>Résumé de la commande</h3>
        <div class="summary-row"><span>Articles (${Cart.count()})</span><span class="price">${fmtMoney(Cart.total())}</span></div>
        <div class="summary-row"><span>Livraison</span><span>Confirmée par message</span></div>
        <div class="summary-row total"><span>Total</span><span class="price">${fmtMoney(Cart.total())}</span></div>
        <a href="/checkout.html" class="btn btn-primary btn-block" style="margin-top:18px;">Passer la commande</a>
      </div>
    </div>
  `;
}

function changeQty(product_id, size, qty) {
  if (qty < 1) { Cart.remove(product_id, size); }
  else { Cart.updateQty(product_id, size, qty); }
  render();
}

render();
</script>
</body>
</html>
