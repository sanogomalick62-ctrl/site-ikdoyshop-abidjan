<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suivre ma Commande — IKODY SHOP</title>
<link rel="icon" href="/images/logo.png">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div id="siteHeader"></div>

<div class="page-head">
  <div class="wrap">
    <div class="breadcrumb"><a href="/index.html">Accueil</a> / Suivre ma commande</div>
    <h1>Suivre ma commande</h1>
  </div>
</div>

<div class="section">
  <div class="wrap" style="max-width:560px;">
    <div id="alertBox"></div>
    <form id="trackForm">
      <div class="form-group">
        <label for="ref">Référence de commande *</label>
        <input type="text" id="ref" placeholder="IKD-123456ABCDE" required>
      </div>
      <div class="form-group">
        <label for="phone">Numéro de téléphone utilisé à la commande *</label>
        <input type="tel" id="phone" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Vérifier le statut</button>
    </form>

    <div id="result" style="margin-top:30px;"></div>
  </div>
</div>

<div id="siteFooter"></div>

<script src="/js/api.js"></script>
<script src="/js/cart.js"></script>
<script src="/js/layout.js"></script>
<script>
initLayout('track');

const statusLabels = {
  new: 'Commande reçue',
  contacted: 'Nous vous avons contacté',
  confirmed: 'Confirmée — préparation en cours',
  shipped: 'Expédiée',
  completed: 'Livrée',
  cancelled: 'Annulée'
};

document.getElementById('trackForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const ref = document.getElementById('ref').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const alertBox = document.getElementById('alertBox');
  const result = document.getElementById('result');
  alertBox.innerHTML = '';
  result.innerHTML = '';

  try {
    const order = await API.get(`/api/orders/track/${encodeURIComponent(ref)}?phone=${encodeURIComponent(phone)}`);
    result.innerHTML = `
      <div class="summary-box">
        <h3>Commande ${escapeHtml(order.order_ref)}</h3>
        <div class="summary-row"><span>Statut</span><span style="font-weight:700;">${statusLabels[order.status] || order.status}</span></div>
        <div class="summary-row"><span>Passée le</span><span>${new Date(order.created_at).toLocaleDateString('fr-FR')}</span></div>
        <div style="margin:14px 0; border-top:2px dashed var(--line); padding-top:14px;">
          ${order.items.map(i => `
            <div class="summary-row"><span>${escapeHtml(i.name)} (${escapeHtml(i.size)}) x${i.qty}</span><span class="price">${fmtMoney(i.price * i.qty)}</span></div>
          `).join('')}
        </div>
        <div class="summary-row total"><span>Total</span><span class="price">${fmtMoney(order.total)}</span></div>
      </div>
    `;
  } catch (err) {
    alertBox.innerHTML = `<div class="alert alert-error">${escapeHtml(err.message)}</div>`;
  }
});
</script>
</body>
</html>
